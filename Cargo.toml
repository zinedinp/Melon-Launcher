[package]
name = "melon-launcher"
version = "0.2.6"
edition = "2024"
rust-version = "1.100.0"
description = "Melon launcher, versioned independently of the game client"

repository = "https://github.com/zinedinp/Melon-Launcher"
license = "GPL-3.0"

[[bin]]
name = "melon-launcher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
melon-base = { git = "https://github.com/zinedinp/Melon-Client", branch = "main" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
winit = "0.30.13"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
open = "5.4.5"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1.29.2", features = ["v3", "v4", "v5"] }
toml = "1.2.3"
minisign-verify = "0.3.0"

[target.'cfg(windows)'.dependencies]
junction = "2.1.0"

[profile.release]
lto = "thin"

[profile.dist-quick]
inherits = "release"
lto = "thin"
incremental = true
codegen-units = 64
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
minisign = "0.10.0"
